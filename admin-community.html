<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUNDZ | Community</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #080808; color: #f5f5f5; }
    html.light { color-scheme: light; }
    html.light body { background: #f8fafc; color: #0f172a; }
    html.light .bg-black, html.light .bg-black\/90 { background-color: #ffffff !important; }
    html.light .border-white\/10 { border-color: rgba(15, 23, 42, 0.12) !important; }
    html.light .text-white, html.light .text-white\/30, html.light .text-white\/40, html.light .text-white\/50 { color: #334155 !important; }
    html.light .text-white { color: #0f172a !important; }
  </style>
</head>
<body class="min-h-screen bg-black text-white">
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 -translate-x-full border-r border-white/10 bg-black transition-transform duration-300 lg:translate-x-0">
    <div class="flex h-full flex-col">
      <div class="border-b border-white/10 p-6">
        <h1 class="text-2xl font-black tracking-[0.3em]">FUNDZ</h1>
        <p class="mt-2 text-[10px] uppercase tracking-[0.3em] text-white/30">Admin</p>
      </div>
      <nav class="flex-1 space-y-1 overflow-y-auto p-4">
        <a href="admin.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-white/60 hover:bg-white/5 hover:text-white">Dashboard</a>
        <a href="admin-products.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-white/60 hover:bg-white/5 hover:text-white">Products</a>
        <a href="admin-orders.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-white/60 hover:bg-white/5 hover:text-white">Orders</a>
        <a href="admin-customers.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-white/60 hover:bg-white/5 hover:text-white">Customers</a>
        <a href="admin-reviews.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-white/60 hover:bg-white/5 hover:text-white">Reviews</a>
        <a href="admin-community.html" class="flex items-center gap-3 rounded-xl bg-white px-4 py-3 text-sm font-bold text-black">Community</a>
        <a href="admin-coupons.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-white/60 hover:bg-white/5 hover:text-white">Coupons</a>
        <a href="admin-analytics.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-white/60 hover:bg-white/5 hover:text-white">Analytics</a>
      </nav>
      <div class="border-t border-white/10 p-4">
        <a href="index.html" class="mb-2 flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-white/50 hover:bg-white/5 hover:text-white">View Website</a>
      </div>
    </div>
  </aside>

  <div class="lg:pl-72">
    <header class="sticky top-0 z-40 border-b border-white/10 bg-black/90 backdrop-blur">
      <div class="flex h-20 items-center justify-between px-5 md:px-8">
        <button id="menuButton" class="rounded-xl border border-white/10 px-4 py-2 lg:hidden">☰</button>
        <div>
          <p class="text-xs uppercase tracking-[0.3em] text-white/30">FUNDZ Admin</p>
          <h2 class="mt-1 text-xl font-bold">Community</h2>
        </div>
        <div class="flex items-center gap-4">
          <div class="flex h-10 w-10 items-center justify-center rounded-full bg-white text-sm font-black text-black">F</div>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-5 py-8 md:px-8">
      <section class="rounded-2xl border border-white/10 bg-white/[0.03] p-6">
        <p class="text-xs uppercase tracking-[0.3em] text-white/30">Overview</p>
        <h1 class="mt-3 text-3xl font-black uppercase tracking-tight">Community hub</h1>
        <p class="mt-3 max-w-2xl text-sm leading-6 text-white/40">Load community-facing data directly from Supabase and surface it in the dashboard.</p>
      </section>

      <section class="mt-8 grid gap-4 md:grid-cols-2">
        <div class="rounded-2xl border border-white/10 bg-white/[0.03] p-5">
          <p class="text-xs uppercase tracking-wider text-white/30">Featured products</p>
          <h3 id="featuredProducts" class="mt-3 text-2xl font-black">—</h3>
        </div>
        <div class="rounded-2xl border border-white/10 bg-white/[0.03] p-5">
          <p class="text-xs uppercase tracking-wider text-white/30">Profiles</p>
          <h3 id="profileCount" class="mt-3 text-2xl font-black">—</h3>
        </div>
      </section>

      <section class="mt-8 rounded-2xl border border-white/10 bg-white/[0.03] p-6">
        <h2 class="text-lg font-black uppercase">Recent products</h2>
        <div id="communityList" class="mt-6 space-y-3"></div>
      </section>
    </main>
  </div>

  <div id="overlay" class="fixed inset-0 z-40 hidden bg-black/70 lg:hidden"></div>

  <script type="module">
    import { supabase } from './supabase.js';

    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuButton = document.getElementById('menuButton');
    const communityList = document.getElementById('communityList');

    function closeMenu() { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
    menuButton?.addEventListener('click', () => { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); });
    overlay?.addEventListener('click', closeMenu);

    async function loadCommunity() {
      const [productsResult, profilesResult] = await Promise.all([
        supabase.from('products').select('id,title,is_featured,created_at').order('created_at', { ascending: false }).limit(6),
        supabase.from('profiles').select('id').limit(6)
      ]);

      const products = productsResult.data || [];
      const profiles = profilesResult.data || [];

      document.getElementById('featuredProducts').textContent = products.filter((product) => product.is_featured).length.toLocaleString();
      document.getElementById('profileCount').textContent = profiles.length.toLocaleString();

      if (!products.length) {
        communityList.innerHTML = '<div class="rounded-xl border border-white/10 px-4 py-3 text-sm text-white/40">No community data is available yet from Supabase.</div>';
        return;
      }

      communityList.innerHTML = products.map((product) => `
        <div class="flex items-center justify-between rounded-xl border border-white/10 px-4 py-3 text-sm">
          <div>
            <p class="font-bold">${product.title || 'Untitled product'}</p>
            <p class="mt-1 text-xs text-white/40">${product.is_featured ? 'Featured' : 'Standard listing'}</p>
          </div>
          <span class="rounded-full border border-white/10 px-3 py-1 text-xs text-white/40">${product.created_at ? new Date(product.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : 'New'}</span>
        </div>
      `).join('');
    }

    loadCommunity();
  </script>
</body>
</html>
