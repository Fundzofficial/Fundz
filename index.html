<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080908">
  <title>FUNDZ | Streetwear Essentials</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #080908; color: #fff; }
  </style>
</head>
<body>
<main class="pb-10">


  <!-- PROMO -->
  <section class="px-4 pt-5 md:px-8">

    <div
      class="relative overflow-hidden rounded-2xl
             border border-[#a5ff9b]/60
             bg-gradient-to-br from-[#101510] to-[#080908]
             p-5 shadow-[0_0_25px_rgba(165,255,155,.12)]">

      <div class="absolute right-[-25px] top-[-25px]
                  h-24 w-24 rounded-full
                  bg-[#a5ff9b]/10 blur-2xl">
      </div>

      <p class="text-xs font-black uppercase
                tracking-widest text-[#a5ff9b]">
        NIGERIA DROP — NOW LIVE
      </p>

      <h2 class="mt-2 text-xl font-black">
        Streetwear Essentials
      </h2>

      <div class="mt-3 inline-flex rounded-full
                  border border-[#a5ff9b]/50
                  px-3 py-1 text-xs font-bold
                  text-[#a5ff9b]">
        Explore the latest collection
      </div>

    </div>

  </section>


  <!-- NEW ARRIVALS -->
  <section class="px-4 pt-10 md:px-8">

    <div class="mb-4 flex items-center justify-between">

      <h2 class="text-xl font-black">
        New Arrivals
      </h2>

      <a href="shop.html"
         class="text-xs font-bold text-[#a5ff9b]">
        See all →
      </a>

    </div>

    <div
      id="newProductGrid"
      class="grid grid-cols-2 gap-3 md:grid-cols-3 lg:grid-cols-4">
    </div>

  </section>


</main>

<div
  id="mobileMenuOverlay"
  class="fixed inset-0 z-[60] hidden bg-black/70"
  aria-hidden="true"
></div>

<aside
  id="mobileMenu"
  class="fixed inset-y-0 left-0 z-[70] hidden w-[85%] max-w-sm border-r border-white/10 bg-[#080908] p-6"
  aria-label="Main navigation"
>
  <div class="flex items-center justify-between">
    <a href="index.html" class="text-2xl font-black tracking-[.22em] text-[#a5ff9b]">FUNDZ</a>
    <button
      id="mobileMenuClose"
      type="button"
      class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/20 text-2xl hover:bg-white/10"
      aria-label="Close navigation menu"
    >
      ×
    </button>
  </div>

  <nav class="mt-10 flex flex-col gap-5 text-lg uppercase">
    <a href="index.html" class="font-bold text-[#a5ff9b]">Home</a>
    <a href="shop.html" class="text-white/70 hover:text-white">Shop</a>
    <a href="collection.html" class="text-white/70 hover:text-white">Collections</a>
    <a href="addresses.html" class="text-white/70 hover:text-white">Delivery address</a>
  </nav>

  <div class="mt-auto space-y-3">
    <a href="account.html" class="block rounded-full border border-white/20 px-5 py-3 text-center text-sm font-bold hover:bg-white/10">Account</a>
    <a href="wishlist.html" class="block rounded-full border border-white/20 px-5 py-3 text-center text-sm font-bold hover:bg-white/10">Wishlist</a>
    <a href="cart.html" class="block rounded-full border border-white/20 px-5 py-3 text-center text-sm font-bold hover:bg-white/10">Bag</a>
  </div>
</aside>

<script type="module" src="./index.js"></script>
<script src="./site-header.js"></script>
